plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.sayach.vscodepocket'
    compileSdk 36

    defaultConfig {
        applicationId "io.github.sayach.vscodepocket"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

